# nginx für alphalearn.ai im k3s-Cluster (Hetzner).
# Davor: Traefik auf edge-01 (TLS, HSTS, www -> Apex), dann ingress-nginx.
# Dieser Server spricht nur HTTP auf 8080 und bildet das Verhalten von
# GitHub Pages nach, damit sich für Besucher und Google nichts ändert.

server_tokens off;

# Komprimierung wie bei GitHub Pages
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/json
           application/javascript image/svg+xml application/rss+xml;

map $uri $cache_control {
    default                                                       "public, max-age=600";
    ~*\.(?:mp4|webm|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf)$  "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /de -> /de/ als relative Weiterleitung. Ohne das baut nginx
    # http://host:8080/de/ und schickt Besucher hinter dem Proxy ins Leere.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain text/xml application/xml;

    add_header Cache-Control $cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keine versteckten Dateien ausliefern
    location ~ /\. {
        return 404;
    }

    location / {
        # GitHub Pages liefert /seite auch ohne .html aus
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
